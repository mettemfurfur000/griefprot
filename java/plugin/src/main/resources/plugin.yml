name: griefprot
version: '${project.version}'
main: com.tem.griefprot.GriefProtPlugin
api-version: '26.1.2'
description: Face reinforcement and shield points for blocks, backed by the griefprot C library.
author: tem
load: POSTWORLD
commands:
  griefprot:
    description: Debug protection overlays and administer protection data.
    usage: /griefprot <overlay|admin> ...
permissions:
  griefprot.debug:
    description: Use the GriefProt debug overlays.
    default: op
  griefprot.admin:
    description: Inspect and manage GriefProt protection and shields.
    default: op